[project]
name = "dane-technology-assistant"
version = "0.1.0"
description = "Evidence-grounded DANE technology and innovation assistant."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy==2.5.1",
    "openai==2.45.0",
    "pandas==3.0.3",
    "pydantic==2.12.5",
    "python-dotenv==1.2.2",
    "sentence-transformers==5.6.0",
    "streamlit==1.59.2",
    "toyaikit==0.0.11",
]

[dependency-groups]
ingestion = [
    "beautifulsoup4==4.15.0",
    "huggingface-hub==1.23.0",
    "openpyxl==3.1.5",
    "prefect==3.7.8",
    "PyMuPDF==1.28.0",
    "requests==2.34.2",
    "xlrd==2.0.2",
]
publish = [
    "huggingface-hub==1.23.0",
]
